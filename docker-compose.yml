version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/team_management
      - JWT_SECRET=your_jwt_secret_here
    depends_on:
      - mongo
    networks:
      - teamnet

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - teamnet

  mongo:
    image: mongo:6
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: team_management
    volumes:
      - mongo-data:/data/db
    networks:
      - teamnet

volumes:
  mongo-data:

networks:
  teamnet:
    driver: bridge
